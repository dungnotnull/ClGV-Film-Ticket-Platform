services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clgv_db
    ports:
      - "5433:5432"
    volumes:
      - clgv_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clgv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clgv_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=clgv_jwt_super_secret_key_2026
      - JWT_EXPIRATION=86400s
      - JWT_REFRESH_SECRET=clgv_refresh_super_secret_key_2026
      - JWT_REFRESH_EXPIRATION=604800s
      - TICKET_HMAC_SECRET=clgv_hmac_qr_secret_key_2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  clgv_postgres_data:
